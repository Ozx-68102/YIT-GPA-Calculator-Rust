[package]
name = "YIT-GPA-Calculator-Rust"
version = "0.7.0"
edition = "2024"

# 库目标使用 snake_case 名称，满足 Rust 命名规范
[lib]
name = "yit_gpa_tool"

# 发布模式的编译配置
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "yit-gpa-tool"
path = "src/main.rs"

[dependencies]
# 基础依赖
axum = { version = "0.8.8", features = ["multipart"] }
tokio = { version = "1.49.0", features = ["full"] }  # 异步运行时
tera = "1.20.1"   # 模板引擎
rust-embed = "8.11.0"    # 打包 exe
chrono = "0.4.44"   # 时间戳
rand = "0.10.0"  # 随机生成密钥
calamine = "0.33.0" # 解析 Excel 文件

# 用于 Session 管理
tower-sessions = { version = "0.15.0", features = ["memory-store"] }
tower-cookies = { version = "0.11.0", features = ["signed"] }

# 网络解析
reqwest = { version = "0.13.2", features = ["json", "cookies"] }    # HTTP 客户端
scraper = "0.25.0"    # HTML 解析
base64 = "0.22.1"   # Base64 编码

# 数据序列化与反序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"

# 高精度小数
rust_decimal = { version = "1.40.0", features = ["serde", "std"] }
rust_decimal_macros = "1.40.0"

# 其他工具
webbrowser = "1.1.0"   # 自动打开浏览器
anyhow = "1.0.102"   # 简化错误处理
thiserror = "2.0.18"    # 自定义错误
fake_user_agent = "0.2.3"   # 随机 UA
mime_guess = "2.0.5"    # 自动返回正确的 Content-Type
url = "2.5.8"   # 格式化 URL

[dev-dependencies]
tower = "0.5.3"   # 集成测试中 ServiceExt::oneshot 所需
